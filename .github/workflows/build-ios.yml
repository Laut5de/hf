name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (simulator or production)'
        required: true
        default: 'simulator'
        type: choice
        options:
          - simulator
          - production

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS Simulator
        if: ${{ github.event.inputs.profile == 'simulator' }}
        working-directory: artifacts/mobile
        run: eas build --platform ios --profile simulator --non-interactive

      - name: Build iOS Production
        if: ${{ github.event.inputs.profile == 'production' }}
        working-directory: artifacts/mobile
        run: eas build --platform ios --profile production --non-interactive
