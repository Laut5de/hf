name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/mobile/**'
  pull_request:
    branches:
      - main
    paths:
      - 'artifacts/mobile/**'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (preview or production)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK (Preview)
        if: ${{ github.event.inputs.profile != 'production' }}
        working-directory: artifacts/mobile
        run: eas build --platform android --profile preview --non-interactive --output ./build/jmhstream-preview.apk

      - name: Build Android AAB (Production)
        if: ${{ github.event.inputs.profile == 'production' }}
        working-directory: artifacts/mobile
        run: eas build --platform android --profile production --non-interactive

      - name: Upload APK Artifact
        if: ${{ github.event.inputs.profile != 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: jmhstream-android-apk
          path: artifacts/mobile/build/jmhstream-preview.apk
          retention-days: 30

      - name: Comment on PR with build link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Android build completed! Download the APK from the Actions artifacts.'
            })
